# Baseline chunking configuration.
# The chunk-size sweep (Phase E) copies this file and varies chunk_size /
# chunk_overlap; keep every other field fixed so those two are clean
# independent variables.
name: s256_o50          # output -> data/chunks/s256_o50.parquet
strategy: recursive     # recursive natural-boundary splitting
chunk_size: 256         # target tokens per chunk (reference tokenizer below)
chunk_overlap: 50       # tokens carried from the previous chunk (~20%)
cross_page: false       # chunks never span a page -> exactly one page_number each
tokenizer: BAAI/bge-small-en-v1.5   # token ruler; matches the baseline embedder
